name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Создать GitHub Release из собранных артефактов'
        type: boolean
        default: false
      tag:
        description: 'Тег релиза (например v0.5.3); пусто — v<версия из package.json>'
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:portable
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-netmap-windows
          path: |
            release/NetMapPlanner-*-portable.exe
            release/*-win.zip

  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-netmap-tauri
          path: release/NetMapPlanner-*-tauri.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-netmap-linux
          path: release/*.AppImage

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # v3 по умолчанию ставит устаревший пакет "tools" — его больше нет в cmdline-tools 16.
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/netmap-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/netmap-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build debug APK (no signing secrets)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - name: Name APK for release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release/NetMapPlanner-${VERSION}-release.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "release/NetMapPlanner-${VERSION}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-netmap-android
          path: release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: [windows, tauri, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NetMap Planner ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
